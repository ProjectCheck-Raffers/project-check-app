name: Playwright (manual)

# Never runs automatically. Stuart starts it from the Actions tab with "Run workflow".
on:
  workflow_dispatch:
    inputs:
      browsers:
        description: Which browsers
        required: true
        default: chrome-only
        type: choice
        options:
          - chrome-only
          - all-browsers

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Isolate browser tests from live Supabase
        run: echo 'window.PROJECT_CHECK_PLATFORM_CONFIG = {};' > Project-Check-MVP-Master-Build/platform-config.js
      - name: Install test dependencies
        working-directory: tests/playwright
        run: npm ci
      - name: Install browsers
        working-directory: tests/playwright
        run: |
          if [ "${{ inputs.browsers }}" = "all-browsers" ]; then
            npx playwright install --with-deps chromium webkit firefox
          else
            npx playwright install --with-deps chromium
          fi
      - name: Run tests
        working-directory: tests/playwright
        run: |
          if [ "${{ inputs.browsers }}" = "all-browsers" ]; then
            xvfb-run -a npx playwright test
          else
            npx playwright test --project=functional-chromium
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            /tmp/project-check-playwright-html-report/
            /tmp/project-check-playwright-test-results/
          retention-days: 14
